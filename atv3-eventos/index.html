<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atividade 3 — Eventos</title>
  <link rel="stylesheet" href="../shared/style.css" />
</head>
<body>
  <header>
    <h1>Fale com a mentoria</h1>
    <nav aria-label="Navegação principal">
      <ul>
        <li><a href="#contato">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="contato">
      <h2>Formulário de contato</h2>
      <form novalidate>
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" />
          <p id="erro-nome" class="mensagem-erro"></p>
        </div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" />
          <p id="erro-email" class="mensagem-erro"></p>
        </div>

        <div class="campo">
          <label for="assunto">Assunto</label>
          <input type="text" id="assunto" name="assunto" />
          <p id="erro-assunto" class="mensagem-erro"></p>
        </div>

        <div class="campo">
          <label for="mensagem">Mensagem</label>
          <textarea id="mensagem" name="mensagem" rows="4"></textarea>
          <p id="erro-mensagem" class="mensagem-erro"></p>
        </div>

        <button type="submit">Enviar mensagem</button>

        <p id="status-envio" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <p class="rodape-atividade">Atividade 3 de 5 — Mentoria JS CEUMA</p>

  <script type="module" src="app.js"></script>
</body>
</html>
