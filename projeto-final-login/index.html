<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projeto Final — Login</title>
  <link rel="stylesheet" href="../shared/style.css" />
</head>
<body>
  <header>
    <h1>Mentoria CEUMA</h1>
    <nav aria-label="Navegação principal">
      <ul>
        <li><a href="#conteudo">Conteúdo</a></li>
      </ul>
    </nav>
  </header>

  <main id="conteudo">
    <section id="secao-login">
      <h2>Entrar</h2>
      <form id="form-login" novalidate>
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="username" />
          <p id="erro-email" class="mensagem-erro"></p>
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" autocomplete="current-password" />
          <p id="erro-senha" class="mensagem-erro"></p>
        </div>

        <button id="botao-entrar" type="submit">Entrar</button>

        <p id="status-login" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <p class="rodape-atividade">Projeto final — Mentoria JS CEUMA</p>

  <script type="module" src="js/main.js"></script>
</body>
</html>
