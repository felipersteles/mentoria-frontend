<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atividade 5 — Dados de fora</title>
  <link rel="stylesheet" href="../shared/style.css" />
</head>
<body>
  <header>
    <h1>Buscar endereço por CEP</h1>
    <nav aria-label="Navegação principal">
      <ul>
        <li><a href="#endereco">Endereço</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="endereco">
      <h2>Preencha o endereço</h2>
      <form novalidate>
        <div class="campo">
          <label for="cep">CEP</label>
          <input type="text" id="cep" name="cep" inputmode="numeric" maxlength="9" placeholder="00000-000" />
        </div>

        <p id="status-busca" role="status" aria-live="polite"></p>

        <div class="campo">
          <label for="rua">Rua</label>
          <input type="text" id="rua" name="rua" />
        </div>

        <div class="campo">
          <label for="bairro">Bairro</label>
          <input type="text" id="bairro" name="bairro" />
        </div>

        <div class="campo">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" name="cidade" />
        </div>

        <button id="botao-tentar-novamente" type="button" class="botao-secundario" hidden>
          Tentar novamente
        </button>
      </form>
    </section>
  </main>

  <p class="rodape-atividade">Atividade 5 de 5 — Mentoria JS CEUMA</p>

  <script type="module" src="app.js"></script>
</body>
</html>
